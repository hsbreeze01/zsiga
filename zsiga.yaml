intake:
  mode: dir_scan
  dir_scan:
    scan_interval_seconds: 60

pipeline:
  max_changes_per_cycle: 3
  enrich_max_turns: 35
  enrich_timeout: 1200
  impl_max_turns: 30
  impl_timeout_minutes: 20
  fix_attempts: 10
  eval_fix_attempts: 3
  cycle_interval_hours: 8
  compaction:
    enabled: false
    threshold_chars: 60000
    keep_recent: 3
    use_llm_summary: true

safety:
  require_approval: false
  dry_run: false
  protected_paths:
    - "*/migrations/*"
    - "*/settings/prod*"
    - "*/.env"
  max_files_per_task: 3
