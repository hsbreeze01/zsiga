  zsiga:
    path: /home/zsiga/repo
    test_cmd: "venv/bin/python -m pytest -x --tb=short"
    lint_cmd: "venv/bin/python -m ruff check ."
    deploy_branch: zsiga-l5-autonomous-engineer
    merge_to_branches:
      - main
    transport: local

intake:
  mode: dir_scan
  dir_scan:
    scan_interval_seconds: 60

pipeline:
  max_changes_per_cycle: 10
  enrich_max_turns: 50
  enrich_timeout: 2400
  impl_max_turns: 60
  impl_timeout_minutes: 40
  fix_attempts: 10
  optimize_enabled: true
  eval_fix_attempts: 3
  cycle_interval_hours: 8
  compaction:
    enabled: false
    threshold_chars: 60000
    keep_recent: 3
    use_llm_summary: true
  enrich_parallel_explore: true
  explore_pool:
    max_concurrency: 3
    max_turns_per_task: 5
    timeout_per_task: 120
  proposal_gate:
    enabled: true
    max_retries: 1
    steward_max_turns: 3
    steward_timeout: 90
    score_accept: 10
    score_pushback: 6
    learning_weight_days: 90
  design_gate:
    enabled: true
    max_retries: 2
    max_turns: 4
    timeout: 120

  evolution:
    enabled: true
    window_start_hour: 0           # testing: always in window
    window_end_hour: 24
    max_proposals_per_window: 12
    min_cycle_gap_minutes: 15

safety:
  require_approval: false
  dry_run: false
  protected_paths:
    - "*/migrations/*"
    - "*/settings/prod*"
    - "*/.env"
    - "**/*secret*"
    - "**/*token*"
    - "**/*password*"
    - "**/*.key"
    - "**/*.pem"
    - "zsiga.yaml"
    - "zsiga/config.py"
    - "zsiga/git_ops.py"
    - "zsiga/agent/tools.py"
    - "zsiga/agent/policy.py"
    - "zsiga/pipeline/orchestrator.py"
  max_files_per_task: 3

github:
  token: ${GITHUB_TOKEN}
  issue_integration: false
