agent:
  name: zsiga
  llm:
    provider: zhipuai
    model: glm-5.1
    api_key: ${ZHIPUAI_API_KEY}
    base_url: https://open.bigmodel.cn/api/coding/paas/v4
    max_tokens: 4096
    temperature: 0.3

  llm_fast:
    model: glm-4-flash
    base_url: https://open.bigmodel.cn/api/paas/v4

targets:
  factory:
    path: /home/ecs-assist-user/d8q-intelligentengine-datafactory
    test_cmd: "venv/bin/python -m pytest -x --tb=short"
    lint_cmd: "venv/bin/python -m ruff check ."
    deploy_branch: premium
    transport: ssh
    ssh:
      host: 47.99.57.152
      user: root
      key_path: /home/lancer/.ssh/id_ed25519

