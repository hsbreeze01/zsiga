[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zsiga"
version = "0.1.0"
description = "OpenSpec-driven autonomous development agent"
requires-python = ">=3.10"
dependencies = [
    "zai-sdk>=0.2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
zsiga = "zsiga.__main__:main"
